<!DOCTYPE html>
<html lang="en">

<head>
    <title>AI Code Explainer</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/components.css">
    <link rel="stylesheet" href="./css/layouts.css">


    <!--Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@100..900&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Commissioner:wght@100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <nav class="nav-bar">
            <p id="logo-app-name">AI Code Explainer</p>
            <p class="my-name">Made by Abdul Rahman</p>
        </nav>
    </header>
    <main>
        <section id="Home">
            <h1>Welcome to AI Code Explainer</h1>
            <p class="description">Paste your code below and I'll explain it to you</p>

            <form>
                <textarea id="submitted-code-textarea" name="submitted-code" cols="50" rows="25"
                    placeholder="Paste your code here" required autocorrect="off" spellcheck="false"></textarea>
                <button type="sumbit" class="btn btn-primary" id="start-btn">Explain the code</button>
            </form>

            <!--2 possible solutions for a button to link to a page: 1) style <a> as a button 2) Create a form that links to the page once summbited (the form is actually empty)-->
            <a class="btn btn-secondary" id="guide-btn" href="./Guide.html" target="_blank">How To Guide</a>
        </section>
        <section id="Explainer">

        </section>
        <section id="Learner">

        </section>
    </main>
</body>

</html>
